<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Avision</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --gold-dim: rgba(201,168,76,0.15);
      --bg: #080707;
      --bg2: #0f0e0d;
      --bg3: #161412;
      --border: rgba(201,168,76,0.12);
      --border-hover: rgba(201,168,76,0.3);
      --text: #e8e0d0;
      --text-muted: #7a7060;
      --text-dim: #4a4438;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }
    body::before { content:''; position:fixed; inset:0; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E"); pointer-events:none; z-index:0; opacity:0.4; }

    /* LOGIN */
    .login-page { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:2rem; position:relative; }
    .login-page::after { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:500px; height:500px; background:radial-gradient(circle, rgba(201,168,76,0.04) 0%, transparent 70%); pointer-events:none; }
    .login-box { width:100%; max-width:400px; position:relative; z-index:1; }
    .login-brand { text-align:center; margin-bottom:3rem; }
    .login-brand img { height:34px; opacity:0.9; }
    .login-brand span { display:block; font-family:'Cormorant Garamond',serif; font-size:11px; letter-spacing:0.3em; text-transform:uppercase; color:var(--gold); margin-top:10px; opacity:0.8; }
    .login-card { background:var(--bg2); border:1px solid var(--border); padding:2.5rem; }
    .login-card h2 { font-family:'Cormorant Garamond',serif; font-size:1.4rem; font-weight:300; color:var(--text); margin-bottom:0.4rem; }
    .login-card p { font-size:11px; color:var(--text-dim); letter-spacing:0.08em; margin-bottom:2rem; text-transform:uppercase; }
    .fgroup { margin-bottom:1.25rem; }
    .fgroup label { display:block; font-size:10px; letter-spacing:0.15em; text-transform:uppercase; color:var(--text-muted); margin-bottom:8px; }
    .fgroup input, .fgroup select, .fgroup textarea { width:100%; background:var(--bg3); border:1px solid var(--border); padding:11px 14px; color:var(--text); font-size:13px; font-family:'DM Sans',sans-serif; outline:none; transition:border .2s; border-radius:0; }
    .fgroup input:focus, .fgroup select:focus, .fgroup textarea:focus { border-color:rgba(201,168,76,0.4); }
    .fgroup input::placeholder, .fgroup textarea::placeholder { color:var(--text-dim); }
    .fgroup select { cursor:pointer; }
    .fgroup select option { background:var(--bg2); }
    .fgroup textarea { resize:vertical; min-height:80px; }
    .btn-gold { width:100%; background:var(--gold); color:#0a0900; border:none; padding:13px; font-size:11px; letter-spacing:0.15em; text-transform:uppercase; font-family:'DM Sans',sans-serif; font-weight:500; cursor:pointer; transition:all .2s; }
    .btn-gold:hover { background:var(--gold-light); }
    .btn-ghost { background:none; border:1px solid var(--border); padding:9px 16px; color:var(--text-muted); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; font-family:'DM Sans',sans-serif; cursor:pointer; transition:all .2s; }
    .btn-ghost:hover { border-color:var(--border-hover); color:var(--text); }
    .amsg { font-size:12px; margin-top:1rem; min-height:18px; }
    .amsg.err { color:#c44; }
    .amsg.ok { color:#6ab46a; }

    /* ADMIN LAYOUT */
    .admin { display:none; min-height:100vh; flex-direction:column; }

    /* TOPBAR */
    .topbar { background:rgba(8,7,7,0.97); border-bottom:1px solid var(--border); padding:0 2rem; display:flex; align-items:center; justify-content:space-between; height:60px; position:sticky; top:0; z-index:100; backdrop-filter:blur(10px); }
    .tb-brand { display:flex; align-items:center; gap:10px; }
    .tb-brand img { height:24px; opacity:0.85; }
    .tb-sep { width:1px; height:16px; background:var(--border); }
    .tb-label { font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--text-dim); }
    .tb-badge { background:rgba(201,168,76,0.1); border:1px solid var(--border); padding:4px 12px; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold); }
    .tb-right { display:flex; align-items:center; gap:12px; }

    /* BODY GRID */
    .admin-grid { display:grid; grid-template-columns:300px 1fr 300px; min-height:calc(100vh - 60px); position:relative; z-index:1; }
    .col-left { border-right:1px solid var(--border); padding:2rem 1.5rem; overflow-y:auto; }
    .col-mid { padding:2rem; overflow-y:auto; }
    .col-right { border-left:1px solid var(--border); display:flex; flex-direction:column; }

    /* SECTION LABEL */
    .slabel { font-size:10px; letter-spacing:0.25em; text-transform:uppercase; color:var(--gold); margin-bottom:1.25rem; opacity:0.7; display:flex; align-items:center; gap:10px; }
    .slabel::after { content:''; flex:1; height:1px; background:var(--border); }

    /* STATS */
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); margin-bottom:2.5rem; }
    .stat { background:var(--bg2); padding:1.25rem; }
    .stat-n { font-family:'Cormorant Garamond',serif; font-size:2rem; font-weight:300; color:var(--gold); }
    .stat-l { font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-dim); margin-top:4px; }

    /* TABLE */
    .ptable { width:100%; border-collapse:collapse; border:1px solid var(--border); }
    .ptable th { font-size:10px; letter-spacing:0.15em; text-transform:uppercase; color:var(--text-dim); padding:10px 14px; text-align:left; border-bottom:1px solid var(--border); background:var(--bg2); }
    .ptable td { padding:12px 14px; font-size:13px; border-bottom:1px solid rgba(201,168,76,0.05); vertical-align:middle; }
    .ptable tr:hover td { background:var(--bg2); }
    .ptable tr:last-child td { border-bottom:none; }
    .status-sel { background:var(--bg3); border:1px solid var(--border); padding:5px 10px; color:var(--text-muted); font-size:11px; font-family:'DM Sans',sans-serif; cursor:pointer; outline:none; }
    .del-btn { background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:14px; padding:4px 8px; transition:color .2s; }
    .del-btn:hover { color:#c44; }
    .empty-row { text-align:center; padding:3rem; color:var(--text-dim); font-size:12px; letter-spacing:0.08em; }

    /* ADD FORM */
    .add-card { background:var(--bg2); border:1px solid var(--border); padding:1.5rem; }

    /* CHAT PANEL */
    .chat-clients { padding:1.25rem; border-bottom:1px solid var(--border); }
    .chat-cl-label { font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold); margin-bottom:10px; opacity:0.7; }
    .cl-btn { width:100%; text-align:left; background:none; border:1px solid var(--border); padding:8px 12px; color:var(--text-muted); font-size:11px; cursor:pointer; margin-bottom:6px; font-family:'DM Sans',sans-serif; transition:all .2s; letter-spacing:0.03em; }
    .cl-btn.active { border-color:var(--border-hover); color:var(--gold); background:var(--gold-dim); }
    .cl-btn:hover { border-color:var(--border-hover); color:var(--text); }
    .chat-area { flex:1; display:flex; flex-direction:column; overflow:hidden; }
    .chat-hdr { padding:1rem 1.25rem; border-bottom:1px solid var(--border); font-size:11px; color:var(--text-dim); letter-spacing:0.08em; }
    .chat-msgs { flex:1; overflow-y:auto; padding:1.25rem; display:flex; flex-direction:column; gap:10px; min-height:150px; max-height:calc(100vh - 400px); }
    .chat-msgs::-webkit-scrollbar { width:2px; }
    .chat-msgs::-webkit-scrollbar-thumb { background:var(--border); }
    .mrow { display:flex; flex-direction:column; }
    .mrow.adm { align-items:flex-end; }
    .mrow.cli { align-items:flex-start; }
    .mbubble { max-width:80%; padding:8px 12px; font-size:12px; line-height:1.6; }
    .mrow.adm .mbubble { background:var(--gold); color:#0a0900; border-radius:10px 10px 2px 10px; }
    .mrow.cli .mbubble { background:var(--bg3); color:var(--text); border:1px solid var(--border); border-radius:10px 10px 10px 2px; }
    .mtime { font-size:10px; color:var(--text-dim); margin-top:3px; }
    .msender { font-size:10px; color:var(--gold); opacity:0.5; margin-bottom:2px; letter-spacing:0.06em; }
    .chat-input-row { display:flex; border-top:1px solid var(--border); }
    .chat-in { flex:1; background:var(--bg2); border:none; padding:12px 14px; color:var(--text); font-size:12px; font-family:'DM Sans',sans-serif; outline:none; }
    .chat-in::placeholder { color:var(--text-dim); }
    .btn-send { background:var(--gold); color:#0a0900; border:none; padding:12px 16px; font-size:10px; letter-spacing:0.12em; text-transform:uppercase; font-family:'DM Sans',sans-serif; font-weight:500; cursor:pointer; }
    .btn-send:hover { background:var(--gold-light); }
    .no-client { display:flex; align-items:center; justify-content:center; flex:1; color:var(--text-dim); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; }
    .chat-empty { text-align:center; padding:2rem; color:var(--text-dim); font-size:11px; letter-spacing:0.08em; }

    @media (max-width:1100px) {
      .admin-grid { grid-template-columns:1fr; }
      .col-left, .col-right { border:none; border-top:1px solid var(--border); }
      .stats { grid-template-columns:repeat(2,1fr); }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div class="login-page" id="loginPage">
  <div class="login-box">
    <div class="login-brand">
      <img src="https://www.amiravision.com/logos/White.png" alt="Avision" onerror="this.style.display='none'">
      <span>Admin Panel</span>
    </div>
    <div class="login-card">
      <h2>Welcome back.</h2>
      <p>Avision — Project Management</p>
      <div class="fgroup"><label>Email Address</label><input type="email" id="aEmail" placeholder="contact@amiravision.com"></div>
      <div class="fgroup"><label>Password</label><input type="password" id="aPass" placeholder="••••••••"></div>
      <button class="btn-gold" onclick="adminLogin()">Sign In →</button>
      <div class="amsg" id="lMsg"></div>
    </div>
  </div>
</div>

<!-- ADMIN -->
<div class="admin" id="adminDash">
  <div class="topbar">
    <div class="tb-brand">
      <img src="https://www.amiravision.com/logos/White.png" alt="Avision" onerror="this.style.display='none'">
      <div class="tb-sep"></div>
      <span class="tb-label">Admin Panel</span>
    </div>
    <div class="tb-right">
      <span class="tb-badge">⚡ Admin</span>
      <button class="btn-ghost" onclick="adminLogout()">Exit</button>
    </div>
  </div>

  <div class="admin-grid">
    <!-- LEFT: ADD PROJECT -->
    <div class="col-left">
      <div class="slabel">New Project</div>
      <div class="add-card">
        <div class="fgroup"><label>Client Email</label><input type="email" id="cEmail" placeholder="client@email.com"></div>
        <div class="fgroup"><label>Project Title</label><input type="text" id="pTitle" placeholder="e.g. Samsung Ad Edit"></div>
        <div class="fgroup"><label>Description</label><textarea id="pDesc" placeholder="Brief description..."></textarea></div>
        <div class="fgroup"><label>Status</label>
          <select id="pStatus">
            <option value="pending">Pending</option>
            <option value="inprogress">In Progress</option>
            <option value="review">In Review</option>
            <option value="done">Done ✓</option>
          </select>
        </div>
        <div class="fgroup"><label>Delivery Date</label><input type="text" id="pDate" placeholder="e.g. June 15, 2026"></div>
        <button class="btn-gold" onclick="addProject()">Add Project →</button>
        <div class="amsg" id="addMsg"></div>
      </div>
    </div>

    <!-- MID: PROJECTS -->
    <div class="col-mid">
      <div class="stats">
        <div class="stat"><div class="stat-n" id="tTotal">0</div><div class="stat-l">Total</div></div>
        <div class="stat"><div class="stat-n" id="tActive">0</div><div class="stat-l">Active</div></div>
        <div class="stat"><div class="stat-n" id="tReview">0</div><div class="stat-l">Review</div></div>
        <div class="stat"><div class="stat-n" id="tDone">0</div><div class="stat-l">Done</div></div>
      </div>
      <div class="slabel">All Projects</div>
      <table class="ptable">
        <thead><tr><th>Project</th><th>Client</th><th>Status</th><th>Delivery</th><th></th></tr></thead>
        <tbody id="projBody"><tr><td colspan="5" class="empty-row">Loading projects...</td></tr></tbody>
      </table>
    </div>

    <!-- RIGHT: CHAT -->
    <div class="col-right">
      <div class="chat-clients">
        <div class="chat-cl-label">Conversations</div>
        <div id="clientsList"><div style="color:var(--text-dim);font-size:11px;letter-spacing:0.06em;">No conversations yet</div></div>
      </div>
      <div class="chat-area" id="chatArea">
        <div class="no-client">Select a client</div>
      </div>
    </div>
  </div>
</div>

<script>
const SB_URL = 'https://pwrukagppviyyxdlurxs.supabase.co';
const SB_KEY = 'sb_publishable_0qAX6jXA8bacc2VB0H81Ag_jRVWtpGV';
const ADMIN_EMAIL = 'contact@amiravision.com';
const { createClient } = supabase;
const sb = createClient(SB_URL, SB_KEY, { auth: { storage: window.localStorage, persistSession: true, autoRefreshToken: true, storageKey: 'avision-admin-auth' } });
let activeClient = null, chatSub = null;

function amsg(id, text, type) { const el=document.getElementById(id); el.textContent=text; el.className='amsg '+type; }

async function adminLogin() {
  const e=document.getElementById('aEmail').value, p=document.getElementById('aPass').value;
  if (!e||!p) return amsg('lMsg','Fill all fields.','err');
  if (e!==ADMIN_EMAIL) return amsg('lMsg','Access denied.','err');
  amsg('lMsg','Signing in...','');
  const { error } = await sb.auth.signInWithPassword({ email:e, password:p });
  if (error) return amsg('lMsg', error.message, 'err');
}

async function adminLogout() {
  if (chatSub) { clearInterval(chatSub); chatSub=null; }
  await sb.auth.signOut();
  document.getElementById('adminDash').style.display='none';
  document.getElementById('loginPage').style.display='flex';
}

async function addProject() {
  const ce=document.getElementById('cEmail').value.trim(), t=document.getElementById('pTitle').value.trim();
  const d=document.getElementById('pDesc').value.trim(), s=document.getElementById('pStatus').value, dt=document.getElementById('pDate').value.trim();
  if (!ce||!t) return amsg('addMsg','Email and title required.','err');
  amsg('addMsg','Adding...','');
  const { error } = await sb.from('projects').insert({ client_email:ce, title:t, description:d, status:s, delivery_date:dt });
  if (error) return amsg('addMsg', error.message, 'err');
  amsg('addMsg','✓ Project added!','ok');
  ['cEmail','pTitle','pDesc','pDate'].forEach(id=>document.getElementById(id).value='');
  loadProjects();
}

async function updateStatus(id, s) {
  await sb.from('projects').update({ status:s }).eq('id',id);
  loadProjects();
}

async function deleteProject(id) {
  if (!confirm('Delete this project?')) return;
  await sb.from('projects').delete().eq('id',id);
  loadProjects();
}

async function loadProjects() {
  const { data } = await sb.from('projects').select('*').order('created_at',{ascending:false});
  const tbody = document.getElementById('projBody');
  if (!data||!data.length) {
    tbody.innerHTML='<tr><td colspan="5" class="empty-row">No projects yet — add your first.</td></tr>';
    ['tTotal','tActive','tReview','tDone'].forEach(id=>document.getElementById(id).textContent='0');
    return;
  }
  document.getElementById('tTotal').textContent=data.length;
  document.getElementById('tActive').textContent=data.filter(p=>p.status==='inprogress').length;
  document.getElementById('tReview').textContent=data.filter(p=>p.status==='review').length;
  document.getElementById('tDone').textContent=data.filter(p=>p.status==='done').length;
  const opts=['pending','inprogress','review','done'];
  const labels={pending:'Pending',inprogress:'In Progress',review:'In Review',done:'Done ✓'};
  tbody.innerHTML=data.map(p=>`<tr>
    <td><div style="color:var(--text);font-size:13px;">${p.title}</div><div style="color:var(--text-dim);font-size:11px;margin-top:2px;">${p.description||''}</div></td>
    <td style="font-size:11px;color:var(--text-muted);">${p.client_email||'—'}</td>
    <td><select class="status-sel" onchange="updateStatus(${p.id},this.value)">${opts.map(o=>`<option value="${o}" ${o===p.status?'selected':''}>${labels[o]}</option>`).join('')}</select></td>
    <td style="font-size:11px;color:var(--text-dim);">${p.delivery_date||'—'}</td>
    <td><button class="del-btn" onclick="deleteProject(${p.id})">✕</button></td>
  </tr>`).join('');
}

async function loadClients() {
  const { data } = await sb.from('messages').select('client_email').order('created_at',{ascending:false});
  const unique=[...new Set((data||[]).map(m=>m.client_email))];
  const list=document.getElementById('clientsList');
  if (!unique.length) { list.innerHTML='<div style="color:var(--text-dim);font-size:11px;letter-spacing:0.06em;">No conversations yet</div>'; return; }
  list.innerHTML=unique.map(email=>`<button class="cl-btn ${activeClient===email?'active':''}" onclick="selectClient('${email}')">${email}</button>`).join('');
}

async function selectClient(email) {
  activeClient=email;
  if (chatSub) { clearInterval(chatSub); chatSub=null; }
  document.querySelectorAll('.cl-btn').forEach(b=>b.classList.toggle('active',b.textContent===email));
  const area=document.getElementById('chatArea');
  area.innerHTML=`
    <div class="chat-hdr">💬 ${email}</div>
    <div class="chat-msgs" id="chatMsgs"><div class="chat-empty">Loading...</div></div>
    <div class="chat-input-row">
      <input type="text" class="chat-in" id="adminIn" placeholder="Reply to client..." onkeydown="if(event.key==='Enter')adminSend()">
      <button class="btn-send" onclick="adminSend()">Send</button>
    </div>`;
  const { data } = await sb.from('messages').select('*').eq('client_email',email).order('created_at',{ascending:true});
  renderMsgs(data||[]);
  let lastId = data&&data.length ? data[data.length-1].id : 0;
  chatSub = setInterval(async () => {
    if (!activeClient) return;
    const { data: fresh } = await sb.from('messages').select('*').eq('client_email', activeClient).order('created_at', { ascending: true });
    if (!fresh||!fresh.length) return;
    const latest = fresh[fresh.length-1];
    if (latest.id !== lastId) { lastId=latest.id; renderMsgs(fresh); }
  }, 3000);
}

function renderMsgs(data) {
  const c=document.getElementById('chatMsgs'); if(!c)return;
  if (!data.length) { c.innerHTML='<div class="chat-empty">No messages yet.</div>'; return; }
  c.innerHTML=data.map(m=>{
    const isAdm=m.sender==='admin';
    const t=new Date(m.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    return `<div class="mrow ${isAdm?'adm':'cli'}">${!isAdm?'<div class="msender">Client</div>':''}<div class="mbubble">${m.message}</div><div class="mtime">${t}</div></div>`;
  }).join('');
  c.scrollTop=c.scrollHeight;
}

async function adminSend() {
  if (!activeClient) return;
  const input=document.getElementById('adminIn'), m=input.value.trim();
  if (!m) return;
  input.value='';
  await sb.from('messages').insert({ client_email:activeClient, sender:'admin', message:m });
}

sb.auth.onAuthStateChange((event, session) => {
  if (session && session.user.email===ADMIN_EMAIL) {
    document.getElementById('loginPage').style.display='none';
    document.getElementById('adminDash').style.display='flex';
    loadProjects(); loadClients();
    setInterval(loadClients, 10000);
  } else if (!session) {
    document.getElementById('adminDash').style.display='none';
    document.getElementById('loginPage').style.display='flex';
  }
});
</script>
</body>
</html>
